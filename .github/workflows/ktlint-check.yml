name: Kotlin Lint Check

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ktlint:
    name: Run ktlint check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # This job runs ./gradlew too, so it needs the same gate as pull-request.yml -- otherwise a
      # PR that swapped gradle-wrapper.jar would still get it executed here.
      - name: Validate wrapper checksum
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run ktlint check
        run: ./gradlew ktlintCheck --stacktrace
