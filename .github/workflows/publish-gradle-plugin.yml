name: Publish Gradle Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.0.0)'
        required: true
        type: string
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      confirm:
        description: 'Are you sure you want to deploy?'
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-gradle-plugin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Inputs go through `env:` rather than being interpolated into the shell body: this job
      # holds the publish credentials, and a value containing shell metacharacters would otherwise
      # execute on the runner.
      - name: Validate inputs
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "true" ]; then
            echo "Deployment has been cancelled."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Validate wrapper checksum
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests before publishing
        run: ./gradlew build --stacktrace

      - name: Validate plugin before publishing
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew publishPlugins --validate-only

      - name: Publish plugin to Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew publishPlugins

      # Note: the `environment` input is not wired into the publish step -- every run targets the
      # real Gradle Plugin Portal -- so it is deliberately not mentioned here.
      - name: Notify success
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          echo "✅ Plugin $VERSION has been published to the Gradle Plugin Portal."
