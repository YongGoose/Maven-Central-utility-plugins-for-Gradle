name: pull_request

on:
  push:
    branches: [ main ]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

# Superseded pushes to the same branch stop burning runners. Never cancel a main build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # gradle-wrapper.jar is a binary committed to the repository, so verify it matches a
  # published Gradle release before any job is allowed to execute it.
  validate-wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate wrapper checksum
        uses: gradle/actions/wrapper-validation@v6

  ci:
    name: Build (${{ matrix.os }})
    needs: validate-wrapper
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # The plugin is developed on Windows and released for Linux CI users; both
        # need to stay green, and the TestKit tests are the most path-sensitive part.
        os: [ ubuntu-latest, windows-latest ]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only the main branch writes to the shared cache; PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/build/test-results/
            **/build/reports/
          retention-days: 30
